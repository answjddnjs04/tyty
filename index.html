<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폐차 견적 서비스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0D1117;
            --secondary: #30363D;
            --accent: #58A6FF;
            --text-primary: #FFFFFF;
            --text-secondary: #8B949E;
            --text-muted: #6E7681;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            min-height: 100vh;
        }

        /* 좌측 장식 영역 */
        .decoration-area {
            position: relative;
            background: var(--primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        /* 자연물 영감 곡선 요소들 */
        .curve-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.03;
        }

        .curve-1 {
            width: 800px;
            height: 800px;
            background: var(--accent);
            top: -200px;
            left: -300px;
            animation: float1 20s ease-in-out infinite;
        }

        .curve-2 {
            width: 600px;
            height: 600px;
            background: var(--accent);
            bottom: -150px;
            left: 20%;
            animation: float2 25s ease-in-out infinite;
        }

        .curve-3 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: 30%;
            right: -100px;
            animation: float3 18s ease-in-out infinite;
        }

        /* 유기적 곡선 라인 */
        .organic-line {
            position: absolute;
            fill: none;
            stroke: var(--accent);
            stroke-width: 1;
            opacity: 0.08;
        }

        .organic-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 20px) scale(1.05); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, -30px) scale(1.03); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15px, -25px) scale(1.02); }
        }

        /* 좌측 컨텐츠 */
        .decoration-content {
            position: relative;
            z-index: 1;
        }

        .brand {
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .hero-title .highlight {
            color: var(--accent);
        }

        .hero-description {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 480px;
        }

        .stats-row {
            display: flex;
            gap: 48px;
            margin-top: 60px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 우측 서비스 영역 */
        .service-area {
            background: var(--secondary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 48px;
            border-left: 1px solid rgba(88, 166, 255, 0.1);
        }

        .service-header {
            margin-bottom: 40px;
        }

        .service-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .service-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 32px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            padding: 18px 20px;
            font-size: 17px;
            font-family: inherit;
            background: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(88, 166, 255, 0.05);
        }

        .submit-button {
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-button:hover {
            background: #79B8FF;
            transform: translateY(-1px);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .info-list {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }

        .info-bullet {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .info-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .contact-section {
            margin-top: 48px;
            padding: 24px;
            background: rgba(88, 166, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(88, 166, 255, 0.1);
        }

        .contact-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .contact-number {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .decoration-area {
                padding: 48px 32px;
                min-height: auto;
            }

            .hero-title {
                font-size: 36px;
            }

            .stats-row {
                gap: 32px;
                margin-top: 40px;
            }

            .service-area {
                border-left: none;
                border-top: 1px solid rgba(88, 166, 255, 0.1);
                padding: 48px 32px;
            }
        }

        @media (max-width: 480px) {
            .decoration-area {
                padding: 40px 24px;
            }

            .hero-title {
                font-size: 28px;
            }

            .hero-description {
                font-size: 16px;
            }

            .stats-row {
                flex-direction: column;
                gap: 24px;
            }

            .service-area {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 좌측 장식 영역 -->
        <div class="decoration-area">
            <!-- 유기적 곡선 SVG -->
            <svg class="organic-svg" viewBox="0 0 800 600" preserveAspectRatio="none">
                <path class="organic-line" d="M-50,300 Q200,100 400,300 T800,250" />
                <path class="organic-line" d="M-50,400 Q150,200 350,350 T750,300" style="opacity: 0.05;" />
                <path class="organic-line" d="M0,500 Q250,350 500,450 T900,400" style="opacity: 0.04;" />
            </svg>

            <!-- 원형 장식 요소 -->
            <div class="curve-element curve-1"></div>
            <div class="curve-element curve-2"></div>
            <div class="curve-element curve-3"></div>

            <!-- 컨텐츠 -->
            <div class="decoration-content">
                <div class="brand">폐차 견적 서비스</div>
                <h1 class="hero-title">
                    내 차의 <span class="highlight">정확한 가치</span>를<br>
                    지금 바로 확인하세요
                </h1>
                <p class="hero-description">
                    복잡한 절차 없이 차량 번호만 입력하면
                    예상 폐차 견적을 즉시 확인할 수 있습니다.
                </p>

                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-value">50,000+</span>
                        <span class="stat-label">누적 견적 조회</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">98%</span>
                        <span class="stat-label">고객 만족도</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">24시간</span>
                        <span class="stat-label">빠른 응대</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 서비스 영역 -->
        <div class="service-area">
            <div class="service-header">
                <h2 class="service-title">무료 견적 조회</h2>
                <p class="service-subtitle">
                    차량 번호를 입력하시면 예상 견적을 바로 확인하실 수 있습니다.
                </p>
            </div>

            <div class="input-group">
                <label class="input-label">차량 번호</label>
                <input
                    type="text"
                    class="input-field"
                    placeholder="예: 12가 3456"
                    maxlength="10"
                >
            </div>

            <button class="submit-button">견적 보기</button>

            <div class="info-list">
                <div class="info-item">
                    <div class="info-bullet"></div>
                    <p class="info-text">조회 즉시 예상 견적 금액을 확인할 수 있습니다</p>
                </div>
                <div class="info-item">
                    <div class="info-bullet"></div>
                    <p class="info-text">개인정보는 견적 조회 외 다른 용도로 사용되지 않습니다</p>
                </div>
                <div class="info-item">
                    <div class="info-bullet"></div>
                    <p class="info-text">전국 어디서나 무료 탁송 서비스를 제공합니다</p>
                </div>
            </div>

            <div class="contact-section">
                <p class="contact-label">전화 상담</p>
                <p class="contact-number">1588-0000</p>
            </div>
        </div>
    </div>
</body>
</html>
