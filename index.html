<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폐차 견적 서비스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        input {
            padding: 16px 24px;
            font-size: 18px;
            border: 2px solid #333;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 280px;
            text-align: center;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #888;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .status {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #00ff88;
            color: #1a1a2e;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .features {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .feature {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            width: 150px;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚗</div>
        <h1>폐차 견적 서비스</h1>
        <p class="subtitle">차량 번호만 입력하면 예상 견적을 바로 확인하세요</p>

        <div class="input-group">
            <input type="text" placeholder="차량 번호 입력 (예: 12가 3456)" />
            <button>견적 보기</button>
        </div>

        <div class="status">
            <span class="status-badge">Vercel 연동 테스트 성공!</span>
            <p style="margin-top: 12px; color: #a0a0a0;">이 페이지가 보인다면 배포가 정상적으로 완료된 것입니다.</p>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">빠른 견적</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💬</div>
                <div class="feature-text">AI 상담</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📞</div>
                <div class="feature-text">간편 연결</div>
            </div>
        </div>
    </div>
</body>
</html>
